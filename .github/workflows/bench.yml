name: Bench

on:
  pull_request:
    paths:
      - "src/**"
      - "bench/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/bench.yml"
  workflow_dispatch:
    inputs:
      base:
        description: "ref to compare against"
        default: "main"
      files:
        description: "files per scenario"
        default: "300"
      reps:
        description: "runs per scenario per side"
        default: "5"

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref || inputs.base || 'main' }}
      HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      FILES: ${{ inputs.files || '300' }}
      REPS: ${{ inputs.reps || '5' }}
    steps:
      - name: checkout head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head

      - name: checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || inputs.base || 'main' }}
          path: base

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: head/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: head/pnpm-lock.yaml

      - name: build head
        working-directory: head
        run: |
          pnpm install --frozen-lockfile
          pnpm bench:build

      - name: build base
        working-directory: base
        run: |
          pnpm install --frozen-lockfile
          pnpm bench:build

      - name: run benchmarks
        run: |
          set -euo pipefail
          scenarios=(
            "--files $FILES --size 512 --text 1"
            "--files $FILES --size 512 --text 0"
            "--clone-local --files $FILES --size 512"
          )
          : > base.jsonl
          : > head.jsonl
          for rep in $(seq 1 "$REPS"); do
            for s in "${scenarios[@]}"; do
              IFS=' ' read -r -a flags <<< "$s"
              for side in base head; do
                echo "::group::rep $rep $side $s"
                if ! (cd "$side" && node dist-bench/bench/sync-bench.js "${flags[@]}") >> "$side.jsonl"; then
                  echo "::warning::bench failed on $side: $s"
                fi
                echo "::endgroup::"
              done
            done
          done

      - name: compare
        run: |
          node head/bench/compare.mjs \
            --base base.jsonl --head head.jsonl \
            --base-label "$BASE_REF" --head-label "${HEAD_REF:0:7}" \
            --out comment.md

      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            base.jsonl
            head.jsonl
            comment.md

      - name: comment on pr
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- pushwork-bench -->'
            const body = marker + '\n' + fs.readFileSync('comment.md', 'utf8')
            const {owner, repo} = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            })
            const existing = comments.find(c => c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body})
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body})
            }
